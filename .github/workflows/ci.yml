name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend, cli, sdk-ts]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = "frontend" ]; then
            npx tsc -b
          else
            npx tsc --noEmit
          fi

  sdk-python:
    name: sdk-python install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Smoke import
        working-directory: sdk-python
        run: python -c "import recallos; print('recallos package importable')"
